name: Fetch books, films and photos

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 6am UTC
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch books from Goodreads RSS
        run: python scripts/fetch_books.py

      - name: Fetch films from Letterboxd RSS
        run: python scripts/fetch_films.py

      - name: Build photos index from src/misc/photos/
        run: python scripts/fetch_photos.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/misc/books.json src/misc/films.json src/misc/photos.json
          git diff --staged --quiet || git commit -m "chore: update books, films and photos"
          git push
